name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          persist-credentials: true 
        
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
          
      - name: Install dependencies
        run: bun install

      - name: Create placeholder image
        run: mkdir -p public && echo '<svg width="100%" height="100%" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="#f0f0f0"/><path d="M30,40 L70,40 L70,60 L30,60 Z" stroke="#ccc" fill="none"/><path d="M30,40 L50,60 L70,40" stroke="#ccc" fill="none"/><circle cx="55" cy="45" r="3" fill="#ccc"/></svg>' > public/placeholder.svg
        
      - name: Build
        run: bun run export
        
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: out
          token: ${{ secrets.GITHUB_TOKEN }} 
          clean: true 
          branch: gh-pages 

